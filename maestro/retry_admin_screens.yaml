- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "Список пользователей"
- runFlow:
    when:
      visible: "ПОВТОРИТЬ"
    commands:
      - tapOn: "ПОВТОРИТЬ"
- extendedWaitUntil:
    notVisible: "ПОВТОРИТЬ"
    timeout: 45000
- takeScreenshot: docs/screenshots/qa/retry_admin_users
