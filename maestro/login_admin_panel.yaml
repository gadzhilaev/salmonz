appId: ru.gadzhilaev.salmonz
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "ПРОФИЛЬ"
    commands:
      - tapOn: "ПРОФИЛЬ"
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn:
          id: "logoutButton"
      - extendedWaitUntil:
          visible: "ВЫЙТИ"
          timeout: 10000
      - tapOn: "ВЫЙТИ"
      - extendedWaitUntil:
          visible:
            id: "loginSubmit"
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "loginSubmit"
    timeout: 30000
- tapOn:
    id: "loginEmail"
- eraseText
- inputText: "admin@example.com"
- tapOn:
    id: "loginPassword"
- eraseText
- hideKeyboard
# Password is typed by the host script via osascript (Maestro iOS secure fields truncate).
- evalScript: ${output.passwordReady = true}
- extendedWaitUntil:
    visible:
      id: "loginSubmit"
    timeout: 5000
- tapOn:
    id: "loginSubmit"
- extendedWaitUntil:
    visible: "ПРОФИЛЬ"
    timeout: 45000
- tapOn: "ПРОФИЛЬ"
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "adminPanelEntry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "adminPanelEntry"
- extendedWaitUntil:
    visible:
      id: "adminMenuCategories"
    timeout: 20000
- takeScreenshot: docs/screenshots/qa/offline_admin_panel
