services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salmonz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salmonz}
      POSTGRES_DB: ${POSTGRES_DB:-salmonz}
    # Host port is overridable (POSTGRES_PORT) when 5432 is already taken.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - salmonz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-salmonz} -d $${POSTGRES_DB:-salmonz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - salmonz

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - salmonz_minio_data:/data
    networks:
      - salmonz

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for i in $$(seq 1 60); do
          if mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}" && mc ready local; then
            break
          fi
          if [ "$$i" -eq 60 ]; then
            echo "MinIO did not become ready" >&2
            exit 1
          fi
          sleep 1
        done
        for i in $$(seq 1 30); do
          if mc mb --ignore-existing local/$${S3_BUCKET:-salmonz} && mc anonymous set download local/$${S3_BUCKET:-salmonz}; then
            exit 0
          fi
          if [ "$$i" -eq 30 ]; then
            echo "Unable to initialize MinIO bucket" >&2
            exit 1
          fi
          sleep 1
        done
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-salmonz}
    networks:
      - salmonz

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-salmonz}:${POSTGRES_PASSWORD:-salmonz}@postgres:5432/${POSTGRES_DB:-salmonz}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      LOCAL_UPLOAD_DIR: uploads
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:3000/media}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-salmonz}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/salmonz}
      S3_FORCE_PATH_STYLE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-ChangeMeDemo123!}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - salmonz

volumes:
  salmonz_pg_data:
  salmonz_minio_data:

networks:
  salmonz:
    driver: bridge
