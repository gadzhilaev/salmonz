name: Backend E2E

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-e2e.yml'

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salmonz
          POSTGRES_PASSWORD: salmonz
          POSTGRES_DB: salmonz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salmonz -d salmonz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salmonz:salmonz@localhost:5432/salmonz?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: uploads
      PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:3000/media
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMeAdmin123!
      DEMO_USER_EMAIL: demo@example.com
      DEMO_USER_PASSWORD: ChangeMeDemo123!
      NODE_ENV: test
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Migrate again (idempotent)
        run: npx prisma migrate deploy

      - name: Seed
        run: npx tsx prisma/seed.ts

      - name: Build
        run: npm run build

      - name: Start API
        run: |
          nohup node dist/src/main.js > /tmp/salmonz-api.log 2>&1 &
          echo $! > /tmp/salmonz-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health/live >/dev/null; then
              echo "API live"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/salmonz-api.log; exit 1

      - name: Health ready
        run: |
          curl -sf http://127.0.0.1:3000/api/v1/health/ready | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json

      - name: Live E2E
        env:
          RUN_E2E: '1'
          API_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/salmonz-api.pid ]; then kill "$(cat /tmp/salmonz-api.pid)" || true; fi

  minio-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salmonz
          POSTGRES_PASSWORD: salmonz
          POSTGRES_DB: salmonz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salmonz -d salmonz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salmonz:salmonz@localhost:5432/salmonz?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: salmonz
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/salmonz
      S3_FORCE_PATH_STYLE: 'true'
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMeAdmin123!
      DEMO_USER_EMAIL: demo@example.com
      DEMO_USER_PASSWORD: ChangeMeDemo123!
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run --detach --name salmonz-e2e-minio --network host \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Wait for MinIO and initialize bucket
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null && \
              timeout 5s docker run --rm --network host \
                --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
                minio/mc:latest ready local; then
              echo "MinIO is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "MinIO did not become ready"
              docker logs salmonz-e2e-minio
              exit 1
            fi
            sleep 1
          done

          for i in $(seq 1 30); do
            if docker run --rm --network host \
              --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
              minio/mc:latest mb --ignore-existing local/salmonz && \
              docker run --rm --network host \
                --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
                minio/mc:latest anonymous set download local/salmonz; then
              echo "MinIO bucket is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Unable to initialize MinIO bucket"
              docker logs salmonz-e2e-minio
              exit 1
            fi
            sleep 1
          done

      - name: Install / migrate / seed / build
        run: |
          npm ci
          npm run prisma:generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
          npm run build

      - name: Start API
        shell: bash
        run: |
          set -euo pipefail
          nohup node dist/src/main.js > /tmp/salmonz-api.log 2>&1 &
          echo $! > /tmp/salmonz-api.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/v1/health/live >/dev/null; then
              echo "API is live"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/salmonz-api.log
          exit 1

      - name: S3 upload E2E
        env:
          RUN_E2E: '1'
          API_URL: http://127.0.0.1:3000
        run: |
          npm run test:e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/salmonz-api.pid ]; then kill "$(cat /tmp/salmonz-api.pid)" || true; fi

      - name: Stop MinIO
        if: always()
        run: docker rm --force salmonz-e2e-minio || true
