name: Admin Web

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'

defaults:
  run:
    working-directory: admin-web

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time placeholder; BFF talks to Nest at runtime via env.
          BACKEND_URL: http://127.0.0.1:3000
